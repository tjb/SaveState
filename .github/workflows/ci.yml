name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each build and test step tees its output and turns errors into annotations
# with .github/scripts/annotate-errors.sh before exiting with the tool's status.

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
      - name: Lint
        run: |
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --reporter github-actions-logging
      - name: Check that the custom rules fire
        run: bash .github/scripts/check-lint-rules.sh "$RUNNER_TEMP/swiftlint/swiftlint"

  package:
    name: Package (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build
        run: |
          swift build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build.log
          exit "$status"
      - name: Test
        run: |
          swift test 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" test.log
          exit "$status"

  ios:
    name: Package (iOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build for iOS Simulator (Debug)
        run: |
          xcodebuild build \
            -scheme SaveState-Package \
            -destination 'generic/platform=iOS Simulator' 2>&1 | tee build-debug.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build-debug.log
          exit "$status"
      - name: Build for iOS Simulator (Release)
        run: |
          xcodebuild build \
            -scheme SaveState-Package \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' 2>&1 | tee build-release.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build-release.log
          exit "$status"

  demo:
    name: Demo (iOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Test the demo in the simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          ios = sorted((k for k in runtimes if 'iOS' in k), reverse=True)
          print(next(d['udid'] for k in ios for d in runtimes[k] if d['name'].startswith('iPhone')))
          ")"
          xcodebuild test \
            -project Examples/SaveStateDemo/SaveStateDemo.xcodeproj \
            -scheme SaveStateDemo \
            -destination "id=$udid" 2>&1 | tee demo.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" demo.log
          exit "$status"

  cli:
    name: CLI (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CLI
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          swift build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build.log
          exit "$status"
      - name: Test
        run: |
          swift test 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" test.log
          exit "$status"
      - name: MCP smoke test
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          out="$(mktemp)"
          { printf '%s\n' "$init"; sleep 3; } | .build/debug/savestate mcp > "$out" &
          pid=$!
          sleep 8
          kill "$pid" 2>/dev/null || true
          echo "--- server output"
          cat "$out"
          grep -q '"serverInfo"' "$out" || { echo "::error::MCP server did not answer initialize"; exit 1; }
