name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each build and test step tees its output and turns errors into annotations
# with .github/scripts/annotate-errors.sh before exiting with the tool's status.

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
      - name: Lint
        run: |
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --reporter github-actions-logging
      - name: Check that the custom rules fire
        run: bash .github/scripts/check-lint-rules.sh "$RUNNER_TEMP/swiftlint/swiftlint"

  package:
    name: Package (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build
        run: |
          swift build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build.log
          exit "$status"
      - name: Test
        run: |
          swift test 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" test.log
          exit "$status"
      - name: Test in Release
        # Only here can tests see what Release builds do, such as a registry that's
        # disabled by default.
        run: |
          swift test -c release -Xswiftc -enable-testing 2>&1 | tee test-release.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" test-release.log
          exit "$status"
      - name: Check coverage
        run: python3 .github/scripts/coverage.py . --floor .github/coverage-floor-root.json

  ios:
    name: Package (iOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build for iOS Simulator (Debug)
        run: |
          xcodebuild build \
            -scheme SaveState-Package \
            -destination 'generic/platform=iOS Simulator' 2>&1 | tee build-debug.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build-debug.log
          exit "$status"
      - name: Build for iOS Simulator (Release)
        run: |
          xcodebuild build \
            -scheme SaveState-Package \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' 2>&1 | tee build-release.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build-release.log
          exit "$status"
      - name: Check that a Release app carries no server
        run: |
          derived="$RUNNER_TEMP/release"
          xcodebuild build \
            -project Examples/SaveStateDemo/SaveStateDemo.xcodeproj \
            -scheme SaveStateDemo \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-release-app.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build-release-app.log
          [[ "$status" == 0 ]] || exit "$status"
          bash .github/scripts/check-release-guard.sh
          bash .github/scripts/check-release-binary.sh \
            "$derived/Build/Products/Release-iphonesimulator/SaveStateDemo.app/SaveStateDemo"

  demo:
    name: Demo (iOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Test the demo in the simulator
        # Failed tests get one rerun from a script, because xcodebuild's own retry
        # restarts the test runner instead of retrying when a test has an async setUp
        # and stops at its first failure. A test that only passes on the rerun leaves
        # a warning on the run, because it can be a real intermittent bug.
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          ios = sorted((k for k in runtimes if 'iOS' in k), reverse=True)
          print(next(d['udid'] for k in ios for d in runtimes[k] if d['name'].startswith('iPhone')))
          ")"
          args=(
            -project Examples/SaveStateDemo/SaveStateDemo.xcodeproj
            -scheme SaveStateDemo
            -destination "id=$udid"
            -derivedDataPath "$RUNNER_TEMP/demo"
          )
          xcodebuild test "${args[@]}" 2>&1 | tee demo.log; status=${PIPESTATUS[0]}
          grep -h 'savestate-missed-tap:' demo.log | sed 's/^/::warning::/' || true
          if [[ "$status" != 0 ]]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" demo.log
            bash .github/scripts/rerun-failed-ui-tests.sh demo.log SaveStateDemoUITests "${args[@]}"
          fi
          echo "udid=$udid" >> "$GITHUB_ENV"
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-test-results
          path: ${{ runner.temp }}/demo/Logs/Test/*.xcresult
          retention-days: 7
      - name: Drive the demo through the MCP server
        run: |
          (cd CLI && swift build)
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/demo/Build/Products/Debug-iphonesimulator/SaveStateDemo.app"
          xcrun simctl launch "$udid" dev.tjb.SaveStateDemo
          sleep 5
          python3 .github/scripts/check-mcp-simulator.py CLI/.build/debug/savestate "$udid"

  cli:
    name: CLI (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CLI
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          swift build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build.log
          exit "$status"
      - name: Test
        run: |
          swift test 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" test.log
          exit "$status"
      - name: Check coverage
        working-directory: .
        run: python3 .github/scripts/coverage.py CLI --floor .github/coverage-floor-cli.json
      - name: MCP smoke test
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          out="$(mktemp)"
          { printf '%s\n' "$init"; sleep 3; } | .build/debug/savestate mcp > "$out" &
          pid=$!
          sleep 8
          kill "$pid" 2>/dev/null || true
          echo "--- server output"
          cat "$out"
          grep -q '"serverInfo"' "$out" || { echo "::error::MCP server did not answer initialize"; exit 1; }
