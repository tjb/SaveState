name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each build and test step tees its output and turns errors into annotations
# with .github/scripts/annotate-errors.sh before exiting with the tool's status.

jobs:
  package:
    name: Package (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build
        run: |
          swift build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build.log
          exit "$status"
      - name: Test
        run: |
          swift test 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" test.log
          exit "$status"

  ios:
    name: Package (iOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build for iOS Simulator (Debug)
        run: |
          xcodebuild build \
            -scheme SaveState-Package \
            -destination 'generic/platform=iOS Simulator' 2>&1 | tee build-debug.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build-debug.log
          exit "$status"
      - name: Build for iOS Simulator (Release)
        run: |
          xcodebuild build \
            -scheme SaveState-Package \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' 2>&1 | tee build-release.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build-release.log
          exit "$status"

  cli:
    name: CLI (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CLI
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          swift build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" build.log
          exit "$status"
      - name: Test
        run: |
          swift test 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          bash "$GITHUB_WORKSPACE/.github/scripts/annotate-errors.sh" test.log
          exit "$status"
      - name: MCP smoke test
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          out="$(mktemp)"
          { printf '%s\n' "$init"; sleep 3; } | .build/debug/savestate mcp > "$out" &
          pid=$!
          sleep 8
          kill "$pid" 2>/dev/null || true
          echo "--- server output"
          cat "$out"
          grep -q '"serverInfo"' "$out" || { echo "::error::MCP server did not answer initialize"; exit 1; }
